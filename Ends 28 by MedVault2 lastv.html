<script>
function restartExam(){
    currentIndex = 0;
    answers = {};

    localStorage.removeItem("v2_progress_"+currentExam);

    show("quiz");
    render();
}
function showAllAnswers(){
    currentIndex = 0;
    show("quiz");

    // نعتبر كل الأسئلة متجاوبة عشان يظهر الصح والغلط
    questions.forEach(q=>{
        if(answers[q.id] == null){
            answers[q.id] = -1; // unanswered
        }
    });

    render();
}
// PARSE
function parseQuestions(text){
    return text.split('---').filter(b=>b.trim()).map((block,index)=>{
        const lines = block.trim().split('\n').filter(l=>l.trim());

        const question = lines[0].replace(/Q\d+:\s*/i,'');

        const options = lines
            .filter(l => /^[A-Da-d][\.\)]/.test(l))
            .map(l => l.replace(/^[A-Da-d][\.\)]\s*/,'').trim());

        const answerLine = lines.find(l =>
            l.toLowerCase().includes("correct")
        );

        const correctLetter = answerLine
            .split(':')[1]
            .trim()
            .charAt(0)
            .toUpperCase();

        const correctIndex = correctLetter.charCodeAt(0) - 65;

        return {
            id:index+1,
            text:question,
            options:options,
            correct:correctIndex
        };
    });
}

const egyptianQuestions = parseQuestions(egyptianText);
const wafedeenQuestions = parseQuestions(wafedeenText);

let questions=[];
let currentIndex=0;
let answers={};
let currentExam="";

// OPEN
function openExam(type){
    currentExam=type;

    questions = (type==="egyptian") ? egyptianQuestions : wafedeenQuestions;
    document.getElementById("title").innerText = type;

    loadProgress();
    show("quiz");
    render();
}

// SAVE
function saveProgress(){
    localStorage.setItem("v2_progress_"+currentExam,JSON.stringify({
        index:currentIndex,
        answers:answers
    }));
}

function loadProgress(){
    const data=localStorage.getItem("v2_progress_"+currentExam);
    if(data){
        const p=JSON.parse(data);
        currentIndex=p.index;
        answers=p.answers||{};
    }else{
        currentIndex=0;
        answers={};
    }
}

// UI NAV
function show(id){
    ["home","quiz","result"].forEach(d=>{
        document.getElementById(d).style.display="none";
    });
    document.getElementById(id).style.display="block";
}

function goHome(){ show("home"); }

// RENDER
function render(){
    const q=questions[currentIndex];

    let html=`<div class="question-card"><b>Q${currentIndex+1}:</b> ${q.text}`;

    q.options.forEach((opt,i)=>{
        let cls="option";
        if(answers[q.id]!=null){
            if(i===q.correct) cls+=" correct";
            else if(i===answers[q.id]) cls+=" wrong";
        }
        html+=`<div class="${cls}" onclick="select(${i})">${opt}</div>`;
    });

    html+="</div>";

    document.getElementById("questionContainer").innerHTML=html;

    updateProgress();
    renderOverview();
}

// SELECT
function select(i){
    const q=questions[currentIndex];
    if(answers[q.id]!=null) return;

    answers[q.id]=i;
    saveProgress();
    render();
}

// NAV
function next(){
    if(currentIndex < questions.length-1){
        currentIndex++;
        saveProgress();
        render();
    }else{
        showResult();
    }
}

function prev(){
    if(currentIndex > 0){
        currentIndex--;
        saveProgress();
        render();
    }
}

// PROGRESS
function updateProgress(){
    const percent=Math.round((currentIndex+1)/questions.length*100);
    document.getElementById("progressText").innerText=percent+"%";
    document.getElementById("bar").style.width=percent+"%";
}

// OVERVIEW
function renderOverview(){
    let html="";
    questions.forEach((q,i)=>{
        let cls="overview-btn";
        if(i===currentIndex) cls+=" active";
        else if(answers[q.id]!=null) cls+=" answered";
        html+=`<span class="${cls}" onclick="goTo(${i})">${i+1}</span>`;
    });
    document.getElementById("overview").innerHTML=html;
}

function goTo(i){
    currentIndex=i;
    saveProgress();
    render();
}

// RESULT
function showResult(){
    let score=0;
    questions.forEach(q=>{
        if(answers[q.id]===q.correct) score++;
    });

    document.getElementById("scoreText").innerText =
        `${score} / ${questions.length}`;

    show("result");
}

// REVIEW WRONG
function reviewWrong(){
    currentIndex = questions.findIndex(q => answers[q.id] !== q.correct);
    show("quiz");
    render();
}

</script>
